name: Build and Publish with Homebrew Formula Update

on:
  release:
    types: [ released ]
  push:
    tags:
      - "*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Checkout Kotter Fork
        uses: actions/checkout@v3
        with:
          repository: KyleMcB/kotter
          path: kotter

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract Tag Name
        id: extract_tag
        run: echo "tag_name=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Build and Test
        run: |
          ./gradlew test
          ./gradlew assemble

      - name: Create or Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          tag: ${{ env.tag_name }}
          name: "Release ${{ env.tag_name }}"
          body: "This is the latest build for the tag ${{ env.tag_name }}."
          draft: false
          prerelease: true
          artifacts: kross/build/distributions/*.zip
          replacesArtifacts: true
          removeArtifacts: true
          allowUpdates: true

  update-formula:
    runs-on: ubuntu-latest
    needs: build-and-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@v4
        with:
          # Required, custom GitHub access token with the 'public_repo' and 'workflow' scopes
          token: ${{ secrets.TOKEN }}
          # Optional, will commit with this user name
          user_name: Kyle McBurnett
          # Optional, will commit with this user email
          user_email: kylemcburnett@xingpeds.com

          # Optional, use the origin repository instead of forking
          no_fork: false
          # Optional, defaults to homebrew/core
          tap: KyleMcB/kross
          # Formula name, required
          formula: kross
          # Optional, will be determined automatically
          tag: ${{ env.tag_name }}
          # Optional, will be determined automatically
          revision: ${{ github.sha }}
          # Optional, if don't want to check for already open PRs
          force: false
